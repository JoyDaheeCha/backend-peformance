global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]  # 로컬 bootRun / 컨테이너(8080:8080) 모두 호스트 8080 으로 접근
  - job_name: 'redis'
    static_configs:
      - targets: [ 'redis_exporter:9121' ]